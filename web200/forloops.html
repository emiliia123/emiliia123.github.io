
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Loops Assignment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      border-collapse: collapse;
      margin-bottom: 25px;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: lightblue;
    }
  </style>
</head>
<body>

  <h1>JavaScript For Loops</h1>

  <h2>List of Items</h2>
  <ul id="itemList"></ul>

  <h2>Multiplication Table</h2>
  <table id="multiplicationTable"></table>

  <h2>Muscle Cars</h2>
  <ul id="carList"></ul>

  <h2>First Car Properties</h2>
  <ul id="carProperties"></ul>

  <script src="musclecars.js"></script>
  <script>
    // Standard for loop
    let items = ["Apple", "Banana", "Orange", "Grape", "Mango"];
    let list = "";

    for (let i = 0; i < items.length; i++) {
      list += "<li>" + items[i] + "</li>";
    }

    document.getElementById("itemList").innerHTML = list;

    // Nested for loop for multiplication table
    let table = "";

    for (let i = 1; i <= 10; i++) {
      table += "<tr>";

      for (let j = 1; j <= 10; j++) {
        table += "<td>" + (i * j) + "</td>";
      }

      table += "</tr>";
    }

    document.getElementById("multiplicationTable").innerHTML = table;

    // Extra Credit: for...of loop
    let carList = "";

    for (let car of muscleCars) {
      carList += "<li>" + car.make + " " +
                 car.model + " (" + car.year + ")</li>";
    }

    document.getElementById("carList").innerHTML = carList;

    // Extra Credit: for...in loop
    let properties = "";

    for (let key in muscleCars[0]) {
      properties += "<li>" + key + ": " +
                    muscleCars[0][key] + "</li>";
    }

    document.getElementById("carProperties").innerHTML = properties;
  </script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f3ff;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      background-color: white;
      max-width: 450px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #00000015;
    }

    h1 {
      color: #6b46c1;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #a78bfa;
    }

    .error {
      color: #d62828;
      font-size: 13px;
      margin-top: 5px;
      min-height: 16px;
    }

    .invalid {
      border: 2px solid #d62828;
    }

    button {
      background-color: #6b46c1;
      color: white;
      border: none;
      padding: 13px;
      width: 100%;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #55339e;
    }

    #success {
      color: green;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Create Account</h1>
    <p>Please fill out the registration form.</p>

    <form id="registrationForm" novalidate>

      <label for="firstName">First Name</label>
      <input type="text" id="firstName"
             placeholder="Enter your first name">
      <div class="error" id="firstNameError"></div>

      <label for="lastName">Last Name</label>
      <input type="text" id="lastName"
             placeholder="Enter your last name">
      <div class="error" id="lastNameError"></div>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone"
             placeholder="123-456-7890">
      <div class="error" id="phoneError"></div>

      <label for="email">Email Address</label>
      <input type="email" id="email"
             placeholder="example@email.com">
      <div class="error" id="emailError"></div>

      <label for="address">Address</label>
      <input type="text" id="address"
             placeholder="Enter your full address">
      <div class="error" id="addressError"></div>

      <label for="password">Password</label>
      <input type="password" id="password"
             placeholder="Create a strong password">
      <div class="error" id="passwordError"></div>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword"
             placeholder="Enter your password again">
      <div class="error" id="confirmPasswordError"></div>

      <button type="submit">Register</button>

      <p id="success" role="status"></p>

    </form>
  </div>

  <script>
    const form = document.getElementById("registrationForm");

    const fields = [
      "firstName",
      "lastName",
      "phone",
      "email",
      "address",
      "password",
      "confirmPassword"
    ];

    function showError(field, message) {
      document.getElementById(field + "Error").textContent = message;
      document.getElementById(field).classList.add("invalid");
    }

    function clearError(field) {
      document.getElementById(field + "Error").textContent = "";
      document.getElementById(field).classList.remove("invalid");
    }

    function validateField(field) {
      const input = document.getElementById(field);
      const value = input.value.trim();

      clearError(field);

      if (value === "") {
        showError(field, "This field is required.");
        return false;
      }

      if (field === "email") {
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(value)) {
          showError(field, "Please enter a valid email address.");
          return false;
        }
      }

      if (field === "phone") {
        const digits = value.replace(/\D/g, "");

        if (digits.length !== 10) {
          showError(field, "Please enter a 10-digit phone number.");
          return false;
        }
      }

      if (field === "password") {
        const passwordPattern =
          /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S{8,}$/;

        if (!passwordPattern.test(input.value)) {
          showError(
            field,
            "Use at least 8 characters, an uppercase letter, a lowercase letter, a number, and a special character. No spaces."
          );
          return false;
        }
      }

      if (field === "confirmPassword") {
        const password = document.getElementById("password").value;

        if (input.value !== password) {
          showError(field, "Passwords do not match.");
          return false;
        }
      }

      return true;
    }

    fields.forEach(function(field) {
      const input = document.getElementById(field);

      input.addEventListener("blur", function() {
        validateField(field);
      });

      input.addEventListener("input", function() {
        clearError(field);
        document.getElementById("success").textContent = "";

        if (field === "password") {
          clearError("confirmPassword");
        }
      });
    });

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("success").textContent = "";

      let isValid = true;

      fields.forEach(function(field) {
        if (!validateField(field)) {
          isValid = false;
        }
      });

      if (isValid) {
        document.getElementById("success").textContent =
          "Registration successful! Your information is valid.";

        // Demo only: no information is sent or stored.
        form.reset();
      }
    });
  </script>

</body>
</html>

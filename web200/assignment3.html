<!DOCTYPE html>
<html>
<head>
    <title>Assignment 3</title>
</head>

<body>

    <h1>Miles to Kilometers Converter</h1>

    <p id="original"></p>
    <p id="converted"></p>

    <script>
        let miles = 6;
        let kilometers = miles * 1.609;

        document.getElementById("original").innerHTML =
            "Original value: " + miles + " miles";

        document.getElementById("converted").innerHTML =
            "Converted value: " + kilometers + " kilometers";
    </script>

</body>
</html>

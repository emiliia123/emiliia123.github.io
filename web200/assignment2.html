<!DOCTYPE html>
<html>
<head>
    <title>Assignment 2</title>
</head>

<body>

    <h1>JavaScript Variables and Data Types</h1>

    <div id="output"></div>

    <script>
        /*
        var is an older way to create a variable.
        let is used when the value may change.
        const is used when the value should not change.
        */

        var studentName = "Emiliia";
        let age = 19;
        const isStudent = true;

        document.getElementById("output").innerHTML =
            "Name: " + studentName + "<br>" +
            "Age: " + age + "<br>" +
            "Student: " + isStudent;
    </script>

</body>
</html>
